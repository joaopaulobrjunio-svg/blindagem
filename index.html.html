<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blindagem: o jogo</title>
<style>
:root{--bg:#f4f6fb;--card:#ffffff;--tx:#14213d;--mu:#5b6785;--bd:#d5dbea;--btn:#1d3fa8;--btnt:#ffffff;--ac:#c2410c;--ok:#1a7f4b;--no:#b42318;--okb:#e3f5ec;--nob:#fde8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b3d;--card:#182752;--tx:#f4f6fb;--mu:#a9b5d3;--bd:#2c3d72;--btn:#f26a21;--btnt:#0f1b3d;--ac:#ff8a4c;--ok:#4cd08a;--no:#ff8f82;--okb:#12382f;--nob:#4a1f27}}
:root[data-theme="dark"]{--bg:#0f1b3d;--card:#182752;--tx:#f4f6fb;--mu:#a9b5d3;--bd:#2c3d72;--btn:#f26a21;--btnt:#0f1b3d;--ac:#ff8a4c;--ok:#4cd08a;--no:#ff8f82;--okb:#12382f;--nob:#4a1f27}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:24px 20px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-size:34px;line-height:1.1;margin:0}h2{font-size:26px;line-height:1.15;margin:0}
p{margin:0;font-size:18px}.mu{color:var(--mu);font-size:15px}
.bar{display:flex;gap:6px}.bar i{flex:1;height:6px;border-radius:3px;background:var(--bd)}.bar i.on{background:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-size:18px;font-weight:600;padding:14px 18px;border-radius:12px;border:2px solid var(--btn);background:var(--btn);color:var(--btnt);cursor:pointer;width:100%}
.btn.alt{background:transparent;color:var(--tx);border-color:var(--bd)}
.row{display:flex;gap:12px}.row .btn{flex:1}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input{font:inherit;font-size:18px;padding:12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
label{font-size:15px;color:var(--mu);display:block;margin-bottom:4px}
.msg{font-size:22px;line-height:1.35}
.fb{padding:14px;border-radius:12px;font-size:17px}.fb.ok{background:var(--okb);color:var(--ok)}.fb.no{background:var(--nob);color:var(--no)}
.rule{display:flex;gap:10px;align-items:center;font-size:18px;padding:10px 12px;border-radius:10px;background:var(--nob);color:var(--no)}
.rule.ok{background:var(--okb);color:var(--ok)}
.chk{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;font-size:18px;padding:16px;border-radius:12px;border:2px solid var(--no);background:var(--nob);color:var(--no);cursor:pointer;width:100%}
.chk.ok{border-color:var(--ok);background:var(--okb);color:var(--ok)}
.out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;word-break:break-all;min-height:34px}
.gauge{height:28px;border-radius:14px;background:var(--bd);overflow:hidden}.gauge b{display:block;height:100%;background:var(--ac);border-radius:14px}
.big{font-size:72px;font-weight:700;line-height:1;color:var(--ac)}
</style>
</head>
<body>
<main id="app"></main>
<script>
var M=[
["URGENTE! Sua conta será bloqueada hoje. Clique aqui agora para evitar.","golpe","Urgência e link para clicar: golpistas apressam você."],
["Oi, aqui é do banco. Qual é a sua senha para confirmar sua identidade?","golpe","Banco nunca pede senha por mensagem."],
["Sua encomenda saiu para entrega. Código de rastreio: BR123456.","verdade","Sem pressa e sem pedir dados pessoais."],
["Você ganhou um iPhone! Pague R$ 50 de frete para receber.","golpe","Prêmio que exige pagamento é golpe."],
["Pessoal, a aula de amanhã foi remarcada para as 19h.","verdade","Vem de um contato conhecido e não pede nada."]
];
var CK=["Bloqueio de tela ativado","Verificação em duas etapas ligada","Atualizações do aparelho em dia"];
var s,app=document.getElementById("app");
function reset(){s={st:0,i:0,p:0,r:0,ck:[0,0,0],ans:null}}
function norm(t){return t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function shift(t,k){return norm(t).replace(/[a-z]/g,function(c){return String.fromCharCode(((c.charCodeAt(0)-97+k)%26+26)%26+97)})}
function head(n,t){var d="";for(var i=1;i<=4;i++)d+='<i class="'+(i<=n?"on":"")+'"></i>';return '<div class="bar" aria-hidden="true">'+d+'</div><p class="mu">Fase '+n+' de 4</p><h2>'+t+'</h2>'}
function go(n){s.st=n;render()}
function render(){
var h="",m;
if(s.st===0){
h='<h1>Blindagem: o jogo</h1><p>Quatro fases para blindar o celular. No final, você descobre o seu nível de blindagem.</p><div class="card"><p>1. Golpe ou verdade?<br>2. Criptografia<br>3. Frase-senha<br>4. Checklist do aparelho</p></div><button class="btn" id="go">Começar</button>';
app.innerHTML=h;document.getElementById("go").onclick=function(){go(1)};
}else if(s.st===1){
m=M[s.i];
h=head(1,"Golpe ou verdade?")+'<div class="card"><p class="mu">Mensagem '+(s.i+1)+' de 5</p><p class="msg">“'+m[0]+'”</p></div>';
if(s.ans===null){h+='<div class="row"><button class="btn" data-a="golpe">GOLPE</button><button class="btn alt" data-a="verdade">VERDADE</button></div>'}
else{var ok=s.ans===m[1];h+='<div class="fb '+(ok?"ok":"no")+'">'+(ok?"Acertou! ":"Era "+m[1].toUpperCase()+". ")+m[2]+'</div><button class="btn" id="nx">'+(s.i<4?"Próxima mensagem":"Ir para a fase 2")+'</button>'}
h+='<p class="mu">Pontos: '+s.p+'</p>';
app.innerHTML=h;
Array.prototype.forEach.call(app.querySelectorAll("[data-a]"),function(b){b.onclick=function(){s.ans=b.getAttribute("data-a");if(s.ans===m[1])s.p++;render()}});
var nx=document.getElementById("nx");if(nx)nx.onclick=function(){s.ans=null;if(s.i<4){s.i++;render()}else go(2)};
}else if(s.st===2){
h=head(2,"Criptografia")+'<p>Cada letra anda algumas casas no alfabeto. Use só letras.</p><div class="card"><div><label for="w">Palavra</label><input id="w" autocomplete="off" value="oi"></div><div><label for="c">Número de casas</label><input id="c" type="number" value="3"></div><div class="row"><button class="btn" id="ci">Cifrar</button><button class="btn alt" id="de">Decifrar</button></div><div class="out" id="o" aria-live="polite"></div></div><button class="btn" id="nx">Ir para a fase 3</button>';
app.innerHTML=h;
function run(sg){var k=parseInt(document.getElementById("c").value,10);if(isNaN(k))k=0;document.getElementById("o").textContent=shift(document.getElementById("w").value,sg*k)}
document.getElementById("ci").onclick=function(){run(1)};document.getElementById("de").onclick=function(){run(-1)};
document.getElementById("nx").onclick=function(){go(3)};
}else if(s.st===3){
h=head(3,"Frase-senha")+'<p>Invente uma frase só sua e veja quais regras ela cumpre.</p><div class="card"><div><label for="n">Seu nome</label><input id="n" autocomplete="off"></div><div><label for="f">Sua frase-senha</label><input id="f" autocomplete="off"></div></div><div id="rs" style="display:flex;flex-direction:column;gap:8px" aria-live="polite"></div><button class="btn" id="nx">Ir para a fase 4</button>';
app.innerHTML=h;
var n=document.getElementById("n"),f=document.getElementById("f");
function upd(){var v=f.value,a=norm(n.value.trim());
var r=[[v.length>=12,"Tem 12 letras ou mais"],[/[0-9]/.test(v),"Tem pelo menos um número"],[a.length>0&&v.length>0&&norm(v).indexOf(a)===-1,"Não contém o seu nome"]];
s.r=r.filter(function(x){return x[0]}).length;
document.getElementById("rs").innerHTML=r.map(function(x){return '<div class="rule '+(x[0]?"ok":"")+'"><span>'+(x[0]?"✔":"✘")+'</span>'+x[1]+'</div>'}).join("")+'<p class="mu">'+s.r+' de 3 regras cumpridas</p>'}
n.oninput=upd;f.oninput=upd;upd();
document.getElementById("nx").onclick=function(){go(4)};
}else if(s.st===4){
h=head(4,"Checklist do aparelho")+'<p>Toque no que já está configurado no seu celular. O que ficar em vermelho falta blindar.</p><div id="ck" style="display:flex;flex-direction:column;gap:10px"></div><button class="btn" id="nx">Ver meu nível</button>';
app.innerHTML=h;
function dr(){document.getElementById("ck").innerHTML=CK.map(function(t,i){return '<button class="chk '+(s.ck[i]?"ok":"")+'" data-i="'+i+'" aria-pressed="'+(s.ck[i]?"true":"false")+'"><span>'+(s.ck[i]?"✔":"✘")+'</span>'+t+'</button>'}).join("");
Array.prototype.forEach.call(document.querySelectorAll(".chk"),function(b){b.onclick=function(){var i=+b.getAttribute("data-i");s.ck[i]=s.ck[i]?0:1;dr()}})}
dr();document.getElementById("nx").onclick=function(){go(5)};
}else{
var mk=s.ck[0]+s.ck[1]+s.ck[2],nv=Math.round((s.p+s.r+mk)/11*100);
var t=nv>=80?"Celular blindado.":nv>=50?"Boa base. Falta fechar alguns pontos.":"Há muito para blindar. Comece pelo checklist.";
h='<h1>Seu nível de blindagem</h1><div class="card"><p class="big">'+nv+'%</p><div class="gauge" role="img" aria-label="Nível '+nv+' por cento"><b style="width:'+nv+'%"></b></div><p>'+t+'</p></div><div class="card"><p>Golpe ou verdade: '+s.p+' de 5</p><p>Frase-senha: '+s.r+' de 3 regras</p><p>Checklist: '+mk+' de 3 itens</p></div><button class="btn" id="re">Jogar de novo</button>';
app.innerHTML=h;document.getElementById("re").onclick=function(){reset();render()};
}
window.scrollTo(0,0)}
reset();render();
</script>
</body>
</html>
